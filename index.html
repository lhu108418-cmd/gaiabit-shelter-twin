rop()}</section></div>`}

function animals(){let q=summary();return head('動物與人員','犬貓欄舍配置、照護狀態、人員班次與權限資格，避免用虛構個體冒充實測。',btn('＋ 新增動物','addAnimal','primary')+btn('＋ 新增人員','addStaff'))+`<div class="kpis">${kpi('🐾','分區在所總量',q.animal,'區域彙總數')}${kpi('⌂','物理容量',q.capacity,'不等於可負擔照護容量')}${kpi('♙','示範工作人員',q.staff,'匿名／合成名稱')}${kpi('▣','個體明細',S.animals.length,'可逐筆維護')}${kpi('✚','隔離區動物',S.zones.filter(z=>z.type==='isolation').reduce((a,z)=>a+Number(z.animals),0),'需遵循防疫動線')}${kpi('☷','班表',S.staff.length,'示範班次')}</div><div class="widegap"><section class="panel"><h3>動物個體清單</h3><div style="overflow:auto"><table class="datatable"><tr><th>編號</th><th>動物</th><th>區域</th><th>狀態</th><th></th></tr>${S.animals.map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.name)}</td><td>${esc(zoneName(a.zoneId))}</td><td>${badge(a.health)}</td><td>${btn('編輯','editAnimal:'+a.id)}</td></tr>`).join('')}</table></div></section><section class="panel"><h3>人員與班次</h3><div style="overflow:auto"><table class="datatable"><tr><th>人員</th><th>資格角色</th><th>班次</th><th>位置</th><th></th></tr>${S.staff.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.role)}</td><td>${esc(a.shift)}</td><td>${esc(zoneName(a.zoneId))}</td><td>${btn('編輯','editStaff:'+a.id)}</td></tr>`).join('')}</table></div></section></div>`}
function tasks(){return head('人員班表與照護作業','整合餵食、補水、清潔消毒、巡視、醫療與交接；任務須遵守資格與防疫限制。',btn('＋ 新增任務','addTask','primary'))+`<div class="kpis">${kpi('▣','任務總量',S.tasks.length,'本機示範排程')}${kpi('✓','已完成',S.tasks.filter(t=>t.status==='done').length,'完成任務數')}${kpi('⏱','進行中',S.tasks.filter(t=>t.status==='running').length,'作業進行')}${kpi('⚠','未完成',S.tasks.filter(t=>t.status==='pending').length,'包含重要待辦')}${kpi('♙','當班人員',S.staff.length,'示範人數')}${kpi('✚','需資格任務',S.tasks.filter(t=>t.type==='medical').length,'須資格審查')}</div><section class="panel"><h3>班表及任務排程</h3><div class="pad"><div class="timeline"><i style="--pos:${(simHour-6)/14*90+2}%"></i></div><div class="muted small">06:00　　　　　　09:00　　　　　　12:00　　　　　　15:00　　　　　　18:00　　　　　　20:00</div></div><table class="datatable"><tr><th>工作項目</th><th>區域</th><th>負責人</th><th>預定</th><th>工時</th><th>優先</th><th>進度</th><th>操作</th></tr>${S.tasks.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(zoneName(t.zoneId))}</td><td>${esc(S.staff.find(s=>s.id===t.staffId)?.name||'未指定')}</td><td>${esc(t.time)}</td><td>${t.minutes} 分</td><td>${badge(t.priority==='high'?'優先':'一般',t.priority==='high'?'danger':'')}</td><td>${badge(t.status==='done'?'已完成':t.status==='running'?'進行中':'待執行',t.status==='done'?'ok':'warning')}</td><td>${btn('切換狀態','cycleTask:'+t.id)}</td></tr>`).join('')}</table></section>`}
function devices(){return head('設備與 AI 監測','管理攝影機、感測器、網路點位、覆蓋視角與需人工覆核的 AI 提示。',btn('＋ 新增設備','addDevice','primary'))+`<div class="kpis">${kpi('▣','設備總數',S.devices.length,'所有設備')}${kpi('📹','攝影機',S.devices.filter(d=>d.type==='camera').length,'可視範圍為示意')}${kpi('◉','感測器',S.devices.filter(d=>d.type==='sensor').length,'環境監測')}${kpi('●','正常連線',S.devices.filter(d=>d.status==='online').length,'示範狀態')}${kpi('⚠','待確認事件',S.events.filter(e=>e.status==='unreviewed').length,'未經人工查核')}${kpi('◎','有效 AI 覆蓋','—','須以實測辨識品質確認')}</div><div class="content2"><section class="panel"><h3>設備點位與覆蓋示意</h3><div class="pad">${plane()}<div class="notice warn">攝影機標記目前未計算遮蔽物、AI 有效辨識率或視錐精度；正式部署須實測校正。</div></div></section><section class="panel"><h3>設備清單與 AI 提示</h3><div class="pad">${S.devices.map(d=>`<div class="line"><div style="display:flex;justify-content:space-between;align-items:center"><b>${deviceIcon(d.type)} ${esc(d.name)}</b>${badge(d.status==='online'?'示範在線':'示範離線',d.status==='online'?'ok':'danger')}</div><div class="small muted" style="margin:5px 0">${esc(zoneName(d.zoneId))} · (${d.x}, ${d.y}) m · ${d.type==='camera'?'視角 '+(d.fov||0)+'°':'感測設備'}</div>${btn('切換設備狀態','cycleDevice:'+d.id)}</div>`).join('')}<h4>AI／現場事件</h4>${S.events.map(e=>`<div class="line small">${badge(e.severity==='warning'?'待覆核':'事件',e.severity==='warning'?'warning':'ok')}　${esc(e.message)}<div style="margin-top:5px">${btn(e.status==='resolved'?'已確認':'人工確認','reviewEvent:'+e.id)}</div></div>`).join('')}</div></section></div>`}
function calcScenario(sc){const cams=Math.max(0,Number(sc.cameras)||0),staff=Math.max(0,Number(sc.staff)||0),effective=Math.min(.92,cams/12*.65),detection=(sc.ai?8:45)+(1-effective)*12,travel=8*(sc.routeOptimization?.72:1),handling=20,notification=sc.ai?2:6,confirmation=5,load=staff?Math.round(18/(staff*7)*100):null,coverage=Math.round(effective*100),response=Math.round((detection+notification+confirmation+travel+handling)*10)/10;return {coverage,response,load,cost:sc.budget,discovery:Math.round(detection*10)/10,alerts:sc.ai?Math.round(Number(sc.dailyEvents)*.18*10)/10:null,travel:Math.round(travel*10)/10}}
function simulation(){const sc=S.scenarios.find(x=>x.id===currentScenario)||S.scenarios[1],base=calcScenario(S.scenarios[0]),res=calcScenario(sc);return head('情境實驗室','相同場域與基準條件下，比較導入攝影機、AI、增員、動線優化與資源配置。',btn('執行模擬','runSim','primary')+btn('另存情境','cloneScenario'))+`<div class="notice warn">估算引擎 v1：使用簡化明示公式，不是經校準的 DES／ABM，也不是實際節省成果。真實導入必須另做基準資料蒐集、事件重播與模型驗證。</div><div class="pills" style="margin:13px 0">${S.scenarios.map(x=>`<button class="btn ${currentScenario===x.id?'activebtn':''}" data-scenario="${x.id}">${esc(x.name)}</button>`).join('')}</div><div class="content3"><section class="panel"><h3>模擬條件設定</h3><div class="pad">${[['cameras','攝影機數量','0','50'],['staff','當班照護人力','0','30'],['dailyEvents','每日事件基準','0','30'],['budget','新增預算（NT$）','0','1000000']].map(([k,n,min,max])=>`<label class="field">${n}<input type="number" data-param="${k}" min="${min}" max="${max}" value="${sc[k]}"></label>`).join('')}<label class="line small" style="display:block"><input type="checkbox" class="switch" data-param="ai" ${sc.ai?'checked':''}> 開啟 AI 事件偵測（假設）</label><label class="line small" style="display:block"><input type="checkbox" class="switch" data-param="routeOptimization" ${sc.routeOptimization?'checked':''}> 啟用合規動線改善假設</label><label class="field">亂數種子<input type="number" data-param="seed" value="${sc.seed}"></label></div></section><section class="panel"><h3>基準與導入比較</h3><div class="pad">${[['監測覆蓋（假設 %）',base.coverage,res.coverage],['事件完整回應（分鐘）',base.response,res.response],['工作負荷（%）',base.load??'—',res.load??'—'],['單次路程假設（分鐘）',base.travel,res.travel],['新增預算（NT$）',fmt(base.cost),fmt(res.cost)]].map(([label,a,b])=>`<div class="line small"><b>${label}</b><div class="compare" style="margin-top:8px"><div><span class="muted">基準</span><br><strong>${a}</strong></div><span>→</span><div><span class="cyan">方案</span><br><strong>${b}</strong></div></div></div>`).join('')}</div></section><section class="panel"><h3>情境說明</h3><div class="pad"><p class="small">本模式以相同事件數比較基準情境與修改方案。若人力為零，負荷顯示「—」，不宣稱完成任務。</p><div class="notice">覆蓋：min(92%, 攝影機台數 ÷ 12 × 65%)。<br>事件完整時間：發現＋通知＋確認＋移動＋處置。<br>工作負荷：18 小時需求 ÷ (人力 × 7 有效工時)。</div><div class="notice warn">防疫路徑尚未建立導航網格與硬性限制；「路線優化」目前僅是時間係數假設，不輸出實際可行路徑。</div><h4>最近一次結果</h4><div id="simResult" class="small muted">點「執行模擬」產生結果，結果可下載 JSON。</div></div></section></div>`}
function analytics(){const b=calcScenario(S.scenarios[0]),a=calcScenario(S.scenarios[1]);return head('成效與風險分析','分別顯示基準、假設改善及風險因素；未取得真實資料時不輸出實測結論。',btn('前往情境實驗室','goSimulation'))+`<div class="kpis">${kpi('◉','覆蓋率（推估）',a.coverage+'%','示範公式推估')}${kpi('⏱','反應時間（推估）',a.response+' 分','含處置時間')}${kpi('▣','工作負荷（推估）',a.load+'%','非正式人力需求評估')}${kpi('＄','方案設備預算','NT$ '+fmt(S.scenarios[1].budget),'未含全生命週期成本')}${kpi('⚠','模型風險','高','未做實場校準')}${kpi('☰','可信程度','L1','僅適用概念展示')}</div><div class="widegap"><section class="panel"><h3>基準／導入效益對照</h3><div class="pad">${[['監測覆蓋率',b.coverage+'%',a.coverage+'%'],['事件完整回應',b.response+' 分',a.response+' 分'],['工作負荷',b.load+'%',a.load+'%'],['新增預算','NT$ '+fmt(b.cost),'NT$ '+fmt(a.cost)]].map(x=>`<div class="line small"><b>${x[0]}</b><div class="compare"><div>${x[1]}</div>→<div class="cyan strong">${x[2]}</div></div></div>`).join('')}</div></section><section class="panel"><h3>風險登錄與品質評估</h3><div class="pad">${[['模型比例未校正','高','須實測尺寸與人工確認'],['防疫路線不可突破','高','不因最短距離取消隔離'],['AI 錯誤辨識','高','需誤報／漏報校準與人工覆核'],['展示資料與真實資料混用','高','資料來源與模型級別揭露'],['設備離線或資料過期','中','標示離線與最後資料時間']].map(x=>`<div class="line small">${badge(x[1],x[1]==='高'?'danger':'warning')}　<b>${x[0]}</b><div class="muted" style="padding:4px 0 0 35px">${x[2]}</div></div>`).join('')}</div></section></div>`}
function reports(){return head('報告匯出','輸出可追溯的情境快照、參數、計算公式及使用限制。',btn('下載 JSON 報告','downloadReport','primary')+btn('列印／另存 PDF','printReport'))+`<div class="widegap"><section class="panel"><h3>報告摘要</h3><div class="pad"><div class="reportcard"><div class="eyebrow">數位孿生情境分析</div><h2>${esc(S.shelter.name)}</h2><p class="muted small">模型級別：${esc(S.shelter.model_level)} ｜ 輸入狀態：示範／本機修改 ｜ 版本：${esc(S.versions.at(-1)?.name)}</p><div class="cols3">${[['分區數',S.zones.length],['設備數',S.devices.length],['情境數',S.scenarios.length]].map(x=>`<div class="mini"><span class="muted small">${x[0]}</span><h2>${x[1]}</h2></div>`).join('')}</div><div class="notice warn">此報告僅為假設情境，不可宣稱真實監測覆蓋率、AI 效能或動物福利改善。</div></div></div></section><section class="panel"><h3>輸出內容與限制</h3><div class="pad">${['場域幾何、區域、設備及版本','目前情境與對照基準參數','簡化計算公式、輸出摘要','示範／實測資料標示','風險、待校準條目及使用限制'].map(x=>`<div class="line small">✓ ${x}</div>`).join('')}<div class="notice">PDF 以瀏覽器列印功能輸出；CSV／XLSX 與多頁正式報告排版尚待完整報表服務。</div></div></section></div>`}
function imports(){return head('多格式匯入與智慧建模','區分可預覽、可解析及可建立可靠 3D 三種能力；未完成轉檔服務前不得宣稱自動建模。',btn('上傳來源檔案','pickPlan','primary'))+`<div class="cols3"><div class="panel pad"><div class="iconbox">☁</div><h3>① 上傳來源圖面</h3><p class="small muted">JPG / PNG / WEBP / SVG / PDF / DXF / DWG / IFC / GLB 等；目前只在瀏覽器選擇與預覽，不上傳伺服器。</p>${btn('選擇檔案','pickPlan','primary')}</div><div class="panel pad"><div class="iconbox">▣</div><h3>② 空間校正與標註</h3><p class="small muted">依據實測尺寸，人工建立區域位置、長寬及容量。比例尺校正、牆門線段抽取與導航檢查仍需後續建置。</p>${btn('開啟編輯器','goShelters')}</div><div class="panel pad"><div class="iconbox">⬡</div><h3>③ 3D 預覽與發布</h3><p class="small muted">目前為可旋轉的 L1 概念方塊化模型；不宣稱 DXF／DWG／IFC 自動高精度轉換。</p>${btn('檢視 3D','open3d')}</div></div><section class="panel" style="margin-top:14px"><h3>目前來源文件</h3><div class="pad">${planName?`<b>${esc(planName)}</b>　${badge('待解析','warning')}`:'尚未上傳任何圖面'}<div class="notice warn">下一階段需加入 MIME 及內容安全驗證、私有檔案儲存、背景轉檔佇列、比例校正與人工審核。前端檔案選取不等於安全的伺服器解析。</div></div></section>`}
function permissions(){return head('帳號與權限','場域層級與功能層級授權。示範模式不提供可偽裝為正式登入的權限機制。',btn('Supabase 連線設定','goSettings','primary'))+`<div class="widegap"><section class="panel"><h3>角色權限定義</h3><table class="datatable"><tr><th>角色</th><th>預期權限</th><th>階段</th></tr>${[['系統管理員','平台完整管理','待登入整合'],['場域管理者','所屬場域與人員設備','待 RLS 制定'],['場域編輯','幾何與設備編修','待 RLS 制定'],['模擬分析','情境建立與執行','待 RLS 制定'],['照護資料維護','動物、班表、任務','待 RLS 制定'],['檢視者','限授權場域唯讀','待 RLS 制定'],['公開展示','去識別化／合成資料','待正式發布']].map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td><td>${badge(a[2],'warning')}</td></tr>`).join('')}</table></section><section class="panel"><h3>現階段安全設計</h3><div class="pad"><div class="notice">SQL 包含啟用 RLS 的場域及資料表。初期預設僅允許場域擁有者讀寫；不能把操作介面的角色選項當作安全授權。</div><div class="line small">✓ 私有專案與單場域資料隔離的資料表架構</div><div class="line small">✓ auth.uid() 資料擁有者授權策略</div><div class="line small">✓ 不在前端放入 service_role 或 secret key</div><div class="line small">⚠ 完整成員授權、身分管理、稽核與備份仍須部署伺服器後驗證</div></div></section></div>`}
function versions(){return head('模型版本與發布審核','模型變更保留草稿與發布流程；真實模型必須人工校驗空間尺度與風險。',btn('建立草稿快照','saveVersion','primary'))+`<div class="content2"><section class="panel"><h3>模型版本歷程</h3><table class="datatable"><tr><th>版本</th><th>狀態</th><th>說明</th><th>操作</th></tr>${S.versions.map((v,i)=>`<tr><td>${esc(v.name)}</td><td>${badge(v.status==='published'?'已發布':'草稿',v.status==='published'?'ok':'warning')}</td><td>${esc(v.note||'')}</td><td>${btn('檢視','inspectVersion:'+i)}</td></tr>`).join('')}</table></section><section class="panel"><h3>品質檢查</h3><div class="pad">${[['scale','比例尺實測確認'],['review','空間幾何人工審核'],['navigation','通道及隔離動線驗證'],['real','實場數據校準']].map(([key,name])=>`<label class="line small" style="display:block"><input type="checkbox" data-quality="${key}" ${S.quality[key]?'checked':''}> ${name}</label>`).join('')}<div class="notice warn">此處為人工檢查紀錄，勾選本身不會執行幾何或數值驗證；正式發布仍需審核工作流。</div>${btn('發布當前草稿','publish','primary')}</div></section></div>`}
function settings(){return head('系統設定與連線','部署目標 GitHub → Vercel → Supabase，示範系統保留本機離線操作。',btn('下載本機備份','backup')+btn('重設示範資料','reset','danger'))+`<div class="widegap"><section class="panel"><h3>Supabase 連線準備</h3><div class="pad"><div class="notice warn">目前此 HTML 沒有實作遠端登入、資料寫入與同步；填寫以下欄位僅用於保存連線設定，不代表已連線。請勿填入任何 secret 或 service_role key。</div><label class="field">Project URL<input data-setting="projectUrl" placeholder="https://你的專案.supabase.co" value="${esc(S.settings.projectUrl)}"></label><label class="field">Publishable Key（公開金鑰）<input data-setting="publishableKey" type="password" placeholder="sb_publishable_..." value="${esc(S.settings.publishableKey)}"></label><label class="field">管理員信箱（僅記錄設定）<input type="email" data-setting="email" value="${esc(S.settings.email)}" placeholder="admin@example.org"></label>${btn('儲存本機連線設定','saveSettings','primary')}<div class="notice">正式 Supabase Auth、會員邀請、各資料表 CRUD、檔案私有儲存與跨裝置同步仍需進一步整合；不能把本機資料視為雲端備份。</div></div></section><section class="panel"><h3>資料維護</h3><div class="pad"><div class="line"><b>匯入 JSON 示範／備份</b><p class="muted small">使用本地 JSON 備份復原及更換場域設定。</p>${btn('匯入 JSON','importJson')}</div><div class="line"><b>導出全部資料</b><p class="muted small">以 JSON 下載完整本機資料，包含全部草稿與設定（請保護金鑰與個資）。</p>${btn('下載備份','backup')}</div><div class="line"><b>安全提醒</b><p class="muted small">請勿將真實人員、動物醫療資料或影像放入公開 GitHub／示範資料。Vercel 靜態 HTML 不是安全後端。</p></div></div></section></div>`}
function render(){navRender();$('#main').innerHTML=({dashboard,shelters,import:imports,animals,tasks,devices,simulation,analytics,reports,permissions,versions,settings}[page]||dashboard)();if(page==='shelters'&&editorMode==='3d')requestAnimationFrame(build3d);if(page==='simulation'&&window.lastSim)$('#simResult').textContent=window.lastSim}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function download(name,content,type='application/json'){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function logEvent(msg,type='system'){S.events.unshift({id:uid(),time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false}),type,message:msg,severity:'info',status:'resolved'});S.events=S.events.slice(0,35)}
function editObj(arr,id,fields){let obj=arr.find(x=>x.id===id);if(!obj)return;for(let [key,label] of fields){let val=prompt(label,obj[key]??'');if(val===null)return;if(key==='capacity'||key==='animals'||key==='minutes')val=Math.max(0,Number(val)||0);obj[key]=val}logEvent('人工修改 '+id);save();render()}
function act(s){if(s==='addShelter'){let n=prompt('新場域名稱（目前單場域本機 Demo；建立會覆蓋現有示範）');if(!n)return;if(!confirm('確定建立新場域並清空原有區域／設備／個體？請先備份。'))return;S.shelter={...C.shelter,id:uid(),name:n,status:'draft'};for(let k of ['zones','devices','staff','animals','tasks','events','versions'])S[k]=[];selected='';save();go('shelters');return}
if(s==='addZone'){let n=prompt('新區域名稱','新犬舍');if(!n)return;let z={id:uid(),name:n,type:'dog',x:5,y:5,w:8,h:7,capacity:8,animals:0,color:'#b0e4dd'};S.zones.push(z);selected=z.id;save();go('shelters');return}
if(s==='delZone'){let z=S.zones.find(x=>x.id===selected);if(!z||!confirm(`刪除「${z.name}」？相關設備和個體分區會改為未指定。`))return;S.zones=S.zones.filter(x=>x.id!==selected);S.devices.forEach(x=>{if(x.zoneId===selected)x.zoneId=null});S.animals.forEach(x=>{if(x.zoneId===selected)x.zoneId=null});selected=S.zones[0]?.id;save();render();return}
if(s==='view2d'||s==='view3d'){editorMode=s==='view2d'?'2d':'3d';render();return}if(s==='saveVersion'){let name=prompt('版本名稱',`v1.0.${S.versions.length}`);if(!name)return;S.versions.push({name,status:'draft',date:new Date().toISOString(),note:'本機場域快照',snapshot:{shelter:structuredClone(S.shelter),zones:structuredClone(S.zones),devices:structuredClone(S.devices)}});save();render();return}
if(s==='publish'){if(!S.quality.scale||!S.quality.review||!S.quality.navigation){alert('尚未完成比例、空間審核與導航檢查；不能發布。');return}let v=S.versions.at(-1);if(!v){alert('請先建立草稿版本');return}v.status='published';S.shelter.status='published';save();render();return}
if(s.startsWith('inspectVersion:')){let v=S.versions[+s.split(':')[1]];alert(`${v.name}\n${v.status}\n${v.note||''}\n${v.date||''}`);return}
if(s==='pickPlan'){ $('#planFile').click();return}if(s==='importJson'){$('#importFile').click();return}if(s==='exportBtn'||s==='backup'){download('GaiaBit_Shelter_Twin_backup.json',JSON.stringify(S,null,2));return}
if(s==='addAnimal'){let name=prompt('動物顯示名稱');if(!name)return;let id=prompt('個體 ID',`ANM-${Date.now().toString().slice(-6)}`);if(!id)return;S.animals.push({id,name,species:'dog',zoneId:S.zones[0]?.id,health:'未知',status:'in-shelter'});save();render();return}
if(s==='addStaff'){let name=prompt('人員匿名顯示名稱');if(!name)return;S.staff.push({id:uid(),name,role:'照護員',shift:'08:00–16:00',zoneId:S.zones[0]?.id,status:'on-duty'});save();render();return}
if(s==='addDevice'){let name=prompt('設備編號',`CAM-${String(S.devices.length+1).padStart(3,'0')}`);if(!name)return;S.devices.push({id:uid(),name,type:'camera',zoneId:S.zones[0]?.id,x:5,y:5,status:'online',fov:90,range:12});save();render();return}
if(s==='addTask'){let name=prompt('任務名稱','巡視檢查');if(!name)return;S.tasks.push({id:uid(),name,type:'inspection',zoneId:S.zones[0]?.id,staffId:S.staff[0]?.id,time:'14:00',minutes:30,status:'pending',priority:'normal'});save();render();return}
if(s.startsWith('editAnimal:'))return editObj(S.animals,s.slice(11),[['name','動物顯示名稱'],['health','健康狀態']]);if(s.startsWith('editStaff:'))return editObj(S.staff,s.slice(10),[['name','人員名稱'],['role','資格／角色'],['shift','班別']]);if(s.startsWith('cycleTask:')){let t=S.tasks.find(x=>x.id===s.slice(10));if(t)t.status={pending:'running',running:'done',done:'pending'}[t.status]||'pending';save();render();return}if(s.startsWith('cycleDevice:')){let d=S.devices.find(x=>x.id===s.slice(12));if(d)d.status=d.status==='online'?'offline':'online';save();render();return}if(s.startsWith('reviewEvent:')){let e=S.events.find(x=>x.id===s.slice(12));if(e)e.status='resolved';save();render();return}
if(s==='goSimulation')return go('simulation');if(s==='goShelters')return go('shelters');if(s==='open3d'){editorMode='3d';return go('shelters')}if(s==='goSettings')return go('settings');
if(s==='runSim'){let sc=S.scenarios.find(x=>x.id===currentScenario),result=calcScenario(sc);window.lastSim='已執行 '+new Date().toLocaleString('zh-TW')+'｜種子 '+sc.seed+'｜結果（假設）：覆蓋 '+result.coverage+'%、完整回應 '+result.response+' 分、負荷 '+(result.load??'—')+'%。';logEvent('執行情境「'+sc.name+'」之示範估算');save();render();return}
if(s==='cloneScenario'){let base=S.scenarios.find(x=>x.id===currentScenario);let name=prompt('新情境名稱',base.name+' - 複本');if(!name)return;let n={...structuredClone(base),id:uid(),name};S.scenarios.push(n);currentScenario=n.id;save();render();return}
if(s==='downloadReport'){const result={generatedAt:new Date().toISOString(),classification:'hypothetical-demo-not-real',shelter:S.shelter,modelVersion:S.versions.at(-1)?.name,baseline:S.scenarios[0],scenario:S.scenarios[1],baselineResult:calcScenario(S.scenarios[0]),scenarioResult:calcScenario(S.scenarios[1]),assumptions:{coverage:'min(92%,cameras/12*0.65)',workload:'18/(staff*7)*100',response:'discovery+notification+confirmation+travel+handling'},limitations:['不是實測','未做防疫導航驗證','未校準 AI 準確率','不是完整 DES/ABM']};download('GaiaBit_Shelter_Twin_report.json',JSON.stringify(result,null,2));return}if(s==='printReport'){window.print();return}
if(s==='saveSettings'){if(S.settings.publishableKey&&(!S.settings.publishableKey.startsWith('sb_publishable_')&&!S.settings.publishableKey.startsWith('eyJ'))){alert('此欄只接受 Supabase publishable 或舊版 anon 公開金鑰，切勿儲存 secret 或 service_role');return}S.settings.connected=false;save();alert('已儲存本機設定。尚未進行 Supabase 登入／連線，未完成雲端同步。');return}
if(s==='reset'){if(!confirm('將清空所有本機變更，還原示範資料。確定？'))return;S=structuredClone(C);save();go('dashboard');return}}
function settingChange(t){let k=t.dataset.edit,v=t.value;if(k){let [root,prop]=k.split('.');let obj=root==='zone'?S.zones.find(z=>z.id===selected):S.shelter;if(!obj)return; if(['x','y','w','h','capacity','animals','width','depth'].includes(prop)){v=Number(v);if(!Number.isFinite(v)||v<0)return;if(['w','h','width','depth'].includes(prop)&&v===0)return}obj[prop]=v;save();render();return}if(t.dataset.param){let sc=S.scenarios.find(s=>s.id===currentScenario),key=t.dataset.param;sc[key]=t.type==='checkbox'?t.checked:Number(t.value);save();render();return}if(t.dataset.setting){S.settings[t.dataset.setting]=t.value;save();return}if(t.dataset.quality){S.quality[t.dataset.quality]=t.checked;save();render()}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-page]');if(n){go(n.dataset.page);return}const z=e.target.closest('[data-zone]');if(z){selected=z.dataset.zone;render();return}const d=e.target.closest('[data-device]');if(d){let x=S.devices.find(v=>v.id===d.dataset.device);if(x)alert(`${x.name}\n位置：${zoneName(x.zoneId)}\n狀態：${x.status}\n示範設備`);return}const sc=e.target.closest('[data-scenario]');if(sc){currentScenario=sc.dataset.scenario;render();return}const a=e.target.closest('[data-action]');if(a)act(a.dataset.action)});
document.addEventListener('change',e=>{if(e.target.matches('[data-edit],[data-param],[data-setting],[data-quality]'))settingChange(e.target)});
let drag=null;document.addEventListener('pointerdown',e=>{let z=e.target.closest('.mapzone');if(!z||page!=='shelters'||editorMode!=='2d')return;let m=$('#map'),r=m.getBoundingClientRect(),obj=S.zones.find(x=>x.id===z.dataset.zone);if(!obj)return;selected=obj.id;drag={id:obj.id,startX:e.clientX,startY:e.clientY,x:obj.x,y:obj.y,w:r.width,h:r.height};z.setPointerCapture(e.pointerId)});document.addEventListener('pointermove',e=>{if(!drag)return;let z=S.zones.find(x=>x.id===drag.id);if(!z)return;z.x=Math.max(0,Math.min(S.shelter.width-z.w,Math.round((drag.x+(e.clientX-drag.startX)/drag.w*S.shelter.width)*2)/2));z.y=Math.max(0,Math.min(S.shelter.depth-z.h,Math.round((drag.y+(e.clientY-drag.startY)/drag.h*S.shelter.depth)*2)/2));let node=$(`[data-zone="${drag.id}"].mapzone`);if(node){node.style.left=z.x/S.shelter.width*100+'%';node.style.top=z.y/S.shelter.depth*100+'%'}});document.addEventListener('pointerup',()=>{if(drag){drag=null;save();render()}});
$('#exportBtn').addEventListener('click',()=>act('backup'));$('#importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!(data.shelter&&Array.isArray(data.zones)&&Array.isArray(data.devices)))throw Error('缺少 shelter / zones / devices');if(!confirm('匯入會覆蓋本機資料，確定嗎？'))return;S={...structuredClone(C),...data};save();go('dashboard')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}});$('#planFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;planName=f.name;if(planPreview)URL.revokeObjectURL(planPreview);planPreview=/image\/(png|jpeg|webp|svg\+xml)|application\/pdf/.test(f.type)?URL.createObjectURL(f):'';e.target.value='';go('import')});
setInterval(()=>{$('#clock').textContent=new Date().toLocaleString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})},1000);
async function build3d(){let root=$('#threeView');if(!root)return;try{const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');if(!document.contains(root))return;root.querySelector('.fallback')?.remove();const scene=new THREE.Scene();scene.background=new THREE.Color(0x102b41);const cam=new THREE.PerspectiveCamera(42,root.clientWidth/root.clientHeight,.1,500);cam.position.set(50,50,52);cam.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(root.clientWidth,root.clientHeight);root.prepend(renderer.domElement);const amb=new THREE.AmbientLight(0xffffff,1.5);scene.add(amb);let sun=new THREE.DirectionalLight(0xa9eaff,2.5);sun.position.set(-15,30,20);scene.add(sun);const floor=new THREE.Mesh(new THREE.BoxGeometry(S.shelter.width,1,S.shelter.depth),new THREE.MeshStandardMaterial({color:0x204e5d,roughness:.8}));floor.position.y=-.7;scene.add(floor);let grid=new THREE.GridHelper(70,35,0x39728a,0x28546b);grid.position.y=-.17;scene.add(grid);for(let z of S.zones){let color=new THREE.Color(z.color);const mat=new THREE.MeshStandardMaterial({color,transparent:true,opacity:.83,roughness:.62});let h=z.type==='isolation'?5:3.3;let cube=new THREE.Mesh(new THREE.BoxGeometry(z.w,h,z.h),mat);cube.position.set(z.x+z.w/2-S.shelter.width/2,h/2,z.y+z.h/2-S.shelter.depth/2);scene.add(cube);let edges=new THREE.LineSegments(new THREE.EdgesGeometry(cube.geometry),new THREE.LineBasicMaterial({color:0xe3fafe,transparent:true,opacity:.65}));edges.position.copy(cube.position);scene.add(edges)}for(let d of S.devices){let orb=new THREE.Mesh(new THREE.SphereGeometry(.65,12,12),new THREE.MeshBasicMaterial({color:d.status==='online'?0x05edec:0xf44857}));orb.position.set(d.x-S.shelter.width/2,5.5,d.y-S.shelter.depth/2);scene.add(orb)}let down=false,prev=[0,0],angle=.72,elev=.72,distance=82;root.addEventListener('pointerdown',e=>{down=true;prev=[e.clientX,e.clientY];root.setPointerCapture(e.pointerId)});root.addEventListener('pointerup',()=>down=false);root.addEventListener('pointermove',e=>{if(!down)return;angle+=(e.clientX-prev[0])*.008;elev=Math.max(.2,Math.min(1.45,elev+(e.clientY-prev[1])*.007));prev=[e.clientX,e.clientY]});root.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(35,Math.min(140,distance+e.deltaY*.05))},{passive:false});function frame(){if(!document.contains(root)){renderer.dispose();return}cam.position.set(Math.sin(angle)*Math.cos(elev)*distance,Math.sin(elev)*distance,Math.cos(angle)*Math.cos(elev)*distance);cam.lookAt(0,0,0);renderer.render(scene,cam);requestAnimationFrame(frame)}frame()}catch(err){const el=root.querySelector('.fallback');if(el)el.innerHTML='3D 套件載入失敗。請檢查網路或 CDN。<br>2D 編輯仍可正常使用。';console.error(err)}}
render();
